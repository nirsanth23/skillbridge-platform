name: SkillBridge CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  frontend-ci:
    name: Frontend Quality & Build Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Build Frontend Application
        run: npm run build

  backend-ci:
    name: Backend Quality & Startup Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Tests (if configured)
        run: npm test --if-present

      - name: Validate Server Startup & Health Check
        env:
          PORT: 5001
          NODE_ENV: test
          CLIENT_URL: http://localhost:5173
        run: |
          node src/server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:5001/api/health || (kill -9 $SERVER_PID && exit 1)
          kill $SERVER_PID
